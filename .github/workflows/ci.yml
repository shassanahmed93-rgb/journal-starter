name: Journal API CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: journal-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: career_journal
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: career_journal
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/career_journal
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/career_journal_test
      OPENAI_API_KEY: ci-placeholder-not-used-by-mocks
      OPENAI_BASE_URL: https://example.invalid/v1
      OPENAI_MODEL: ci-placeholder-not-used-by-mocks
      API_ACCESS_TOKEN: ci-test-access-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      API_ADMIN_TOKEN: ci-test-admin-bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked

      - name: Initialize application and test databases
        run: |
          PGPASSWORD=postgres psql \
            -h localhost -U postgres -d career_journal \
            -v ON_ERROR_STOP=1 \
            -f database_setup.sql -f database_setup_test.sql

      - name: Run tests
        run: uv run pytest

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pyright type check
        run: uv run pyright

  build:
    name: build
    needs: test
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.publish.outputs.image }}

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image tagged with the full commit SHA
        run: |
          set -euo pipefail
          docker build \
            --build-arg "GIT_SHA=${GITHUB_SHA}" \
            --tag "journal-api:${GITHUB_SHA}" \
            .

      - name: Configure AWS credentials with GitHub OIDC
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: arn:aws:iam::714687692819:role/journal-api-production-github-build
          aws-region: us-east-1
          role-session-name: journal-api-build-${{ github.run_id }}

      - name: Publish image to ECR
        id: publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          test -n "$ECR_REPOSITORY" || {
            echo "::error::Set ECR_REPOSITORY from Terraform output."
            exit 1
          }

          account_id="$(aws sts get-caller-identity --query Account --output text)"
          registry="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          image="${registry}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$registry"

          docker tag "journal-api:${GITHUB_SHA}" "$image"

          # Each commit has its own immutable tag.
          # Fail if the same tag already exists instead of silently
          # assuming that its image was built from the current source.
          if aws ecr describe-images \
            --region "$AWS_REGION" \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=${GITHUB_SHA}" \
            >/dev/null 2>&1; then
            echo "::error::An image with this commit SHA already exists in ECR."
            echo "::error::Inspect the existing image before deciding whether to reuse it."
            exit 1
          fi

          docker push "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

  deploy:
    name: deploy
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    environment:
      name: production
      url: ${{ vars.PRODUCTION_API_URL }}

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: us-east-1
      AWS_DEPLOY_ROLE_ARN: arn:aws:iam::714687692819:role/journal-api-production-github-deploy
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      DATABASE_ADMIN_SECRET_ID: journal-api-production/database/admin
      DATABASE_APP_SECRET_ID: journal-api-production/database/app
      ALB_CLOUDFRONT_SECURITY_GROUP_ID: ${{ vars.ALB_CLOUDFRONT_SECURITY_GROUP_ID }}
      OTEL_COLLECTOR_ROLE_ARN: ${{ vars.OTEL_COLLECTOR_ROLE_ARN }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
      IMAGE: ${{ needs.build.outputs.image }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

     
      - name: Validate production API URL
        env:
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${PRODUCTION_API_URL:-}" ]]; then
            echo "::error::Set PRODUCTION_API_URL to the public API URL."
            exit 1
          fi
          if [[ "$PRODUCTION_API_URL" != http://* && "$PRODUCTION_API_URL" != https://* ]]; then
            echo "::error::PRODUCTION_API_URL must start with http:// or https://."
            exit 1
          fi
          echo "Production API URL configured."

          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit

          value = os.environ.get("PRODUCTION_API_URL", "").strip()
          try:
              parsed = urlsplit(value)
              valid = (
                  parsed.scheme == "https"
                  and bool(parsed.hostname)
                  and parsed.username is None
                  and parsed.password is None
                  and parsed.path in ("", "/")
                  and not parsed.query
                  and not parsed.fragment
              )
              parsed.port
          except ValueError:
              valid = False

          if not valid:
              raise SystemExit(
                  "Set PRODUCTION_API_URL to the public HTTPS API root."
              )
          PY

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: journal-api-deploy-${{ github.run_id }}

      - name: Configure kubectl
        shell: bash
        run: |
          set -euo pipefail

          test -n "$EKS_CLUSTER_NAME" || {
            echo "::error::Set EKS_CLUSTER_NAME from Terraform output."
            exit 1
          }

          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

          minor="$(aws eks describe-cluster \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query 'cluster.version' \
            --output text)"

          kubectl_version="$(curl --fail --silent --show-error \
            "https://dl.k8s.io/release/stable-${minor}.txt")"

          curl --fail --silent --show-error --location \
            "https://dl.k8s.io/release/${kubectl_version}/bin/linux/amd64/kubectl" \
            --output /tmp/kubectl

          curl --fail --silent --show-error --location \
            "https://dl.k8s.io/release/${kubectl_version}/bin/linux/amd64/kubectl.sha256" \
            --output /tmp/kubectl.sha256

          echo "$(cat /tmp/kubectl.sha256)  /tmp/kubectl" \
            | sha256sum --check

          sudo install -o root -g root -m 0755 \
            /tmp/kubectl /usr/local/bin/kubectl

          kubectl version --client

      - name: Bootstrap database role and runtime secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          API_ACCESS_TOKEN: ${{ secrets.API_ACCESS_TOKEN }}
          API_ADMIN_TOKEN: ${{ secrets.API_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$OPENAI_API_KEY"
          test -n "$API_ACCESS_TOKEN"
          test -n "$API_ADMIN_TOKEN"
          test "$API_ACCESS_TOKEN" != "$API_ADMIN_TOKEN"

          umask 077
          bootstrap_env="$(mktemp)"
          runtime_env="$(mktemp)"
          bootstrap_job="journal-api-db-bootstrap-${GITHUB_RUN_ID}"

          cleanup() {
            status=$?
            rm -f "$bootstrap_env" "$runtime_env"

            kubectl delete job "$bootstrap_job" \
              --namespace journal-api \
              --ignore-not-found \
              --wait=true || status=1

            kubectl delete secret journal-api-db-bootstrap \
              --namespace journal-api \
              --ignore-not-found \
              --wait=true || status=1

            exit "$status"
          }
          trap cleanup EXIT

          database_admin_secret="$(aws secretsmanager get-secret-value \
            --region "$AWS_REGION" \
            --secret-id "$DATABASE_ADMIN_SECRET_ID" \
            --query SecretString --output text)"

          database_app_secret="$(aws secretsmanager get-secret-value \
            --region "$AWS_REGION" \
            --secret-id "$DATABASE_APP_SECRET_ID" \
            --query SecretString --output text)"

          echo "::add-mask::${database_admin_secret}"
          echo "::add-mask::${database_app_secret}"
          echo "::add-mask::${OPENAI_API_KEY}"
          echo "::add-mask::${API_ACCESS_TOKEN}"
          echo "::add-mask::${API_ADMIN_TOKEN}"

          db_admin_user="$(jq -er '.username' <<< "$database_admin_secret")"
          db_admin_password="$(jq -er '.password' <<< "$database_admin_secret")"
          db_app_user="$(jq -er '.username' <<< "$database_app_secret")"
          db_app_password="$(jq -er '.password' <<< "$database_app_secret")"
          db_host="$(jq -er '.host' <<< "$database_app_secret")"
          db_port="$(jq -er '.port' <<< "$database_app_secret")"
          db_name="$(jq -er '.database' <<< "$database_app_secret")"

          database_url="postgresql://${db_app_user}:${db_app_password}@${db_host}:${db_port}/${db_name}"
          echo "::add-mask::${database_url}"

          printf 'PGHOST=%s\nPGPORT=%s\nPGDATABASE=%s\nPGUSER=%s\nPGPASSWORD=%s\nAPP_DB_USERNAME=%s\nAPP_DB_PASSWORD=%s\n' \
            "$db_host" "$db_port" "$db_name" \
            "$db_admin_user" "$db_admin_password" \
            "$db_app_user" "$db_app_password" > "$bootstrap_env"

          printf 'DATABASE_URL=%s\nDATABASE_SSL=true\nOPENAI_API_KEY=%s\nAPI_ACCESS_TOKEN=%s\nAPI_ADMIN_TOKEN=%s\n' \
            "$database_url" "$OPENAI_API_KEY" \
            "$API_ACCESS_TOKEN" "$API_ADMIN_TOKEN" > "$runtime_env"

          kubectl create secret generic journal-api-runtime \
            --namespace journal-api \
            --from-env-file="$runtime_env" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic journal-api-db-bootstrap \
            --namespace journal-api \
            --from-env-file="$bootstrap_env" \
            --dry-run=client -o yaml | kubectl apply -f -

          sed "s/journal-api-db-bootstrap-00000000/${bootstrap_job}/g" \
            k8s/database-bootstrap.yaml | kubectl apply -f -

          kubectl wait --for=condition=complete "job/${bootstrap_job}" \
            --namespace journal-api \
            --timeout=5m

      - name: Apply collector, application, and ingress
        shell: bash
        run: |
          set -euo pipefail

          for value in \
            "$ALB_CLOUDFRONT_SECURITY_GROUP_ID" \
            "$OTEL_COLLECTOR_ROLE_ARN" \
            "$OPENAI_BASE_URL" \
            "$OPENAI_MODEL"; do
            test -n "$value" || {
              echo "::error::A required production variable is empty."
              exit 1
            }
          done

          sed \
            -e "s|OTEL_COLLECTOR_ROLE_ARN_PLACEHOLDER|${OTEL_COLLECTOR_ROLE_ARN}|g" \
            -e "s|AWS_REGION_PLACEHOLDER|${AWS_REGION}|g" \
            k8s/otel-collector.yaml | kubectl apply -f -

          kubectl create configmap journal-api-config \
            --namespace journal-api \
            --from-literal="OPENAI_BASE_URL=${OPENAI_BASE_URL}" \
            --from-literal="OPENAI_MODEL=${OPENAI_MODEL}" \
            --from-literal=OTEL_SERVICE_NAME=journal-api \
            --from-literal=DEPLOYMENT_ENVIRONMENT=production \
            --from-literal=OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector.observability.svc.cluster.local:4317 \
            --from-literal=PYTHONDONTWRITEBYTECODE=1 \
            --dry-run=client -o yaml | kubectl apply -f -

          sed \
            -e "s|IMAGE_PLACEHOLDER|${IMAGE}|g" \
            -e "s|GIT_SHA_PLACEHOLDER|${GITHUB_SHA}|g" \
            k8s/application.yaml \
            | kubectl apply -f -

          sed \
            -e "s|ALB_SECURITY_GROUP_ID_PLACEHOLDER|${ALB_CLOUDFRONT_SECURITY_GROUP_ID}|g" \
            k8s/ingress.yaml | kubectl apply -f -

      - name: Wait for deployment and discover ingress hostname
        shell: bash
        run: |
          set -euo pipefail

          kubectl rollout status deployment/otel-collector \
            --namespace observability --timeout=5m

          kubectl rollout status deployment/journal-api \
            --namespace journal-api --timeout=5m

          kubectl wait \
            --for=jsonpath='{.status.loadBalancer.ingress[0].hostname}' \
            ingress/journal-api \
            --namespace journal-api \
            --timeout=10m

          ingress_host="$(kubectl get ingress journal-api \
            --namespace journal-api \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')"

          echo "Ingress hostname: ${ingress_host}"
          echo "Ingress hostname does not automatically replace the public HTTPS URL."

          echo "=== Deployment image and GIT_SHA ==="
          kubectl get deployment journal-api \
            --namespace journal-api \
            -o jsonpath='{range .spec.template.spec.containers[*]}{.name}{" image="}{.image}{"\n"}{range .env[*]}{.name}{"="}{.value}{"\n"}{end}{end}'

          echo "=== Public HTTPS version verification ==="
          response="$(curl --fail --silent --show-error \
            --retry 10 --retry-all-errors --retry-delay 6 --max-time 15 \
            "${PRODUCTION_API_URL%/}/version")"

          printf '%s' "$response" | DEPLOYED_SHA="$GITHUB_SHA" python3 -c '
          import json
          import os
          import re
          import sys

          response = json.load(sys.stdin)
          deployed = response.get("commit")
          expected = os.environ["DEPLOYED_SHA"]

          if not isinstance(deployed, str) or not re.fullmatch(r"[0-9a-f]{40}", deployed):
              raise SystemExit("Production /version did not return a full commit SHA.")

          if deployed != expected:
              raise SystemExit(
                  f"Production SHA {deployed} does not match deployed SHA {expected}."
              )

          print(f"PASS: production HTTPS /version reports deployed commit {expected}")
          '
