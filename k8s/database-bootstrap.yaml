apiVersion: v1
kind: ConfigMap
metadata:
  name: journal-api-database-bootstrap
  namespace: journal-api
data:
  bootstrap.sql: |
    \getenv app_db_password APP_DB_PASSWORD
    SELECT format('CREATE ROLE journal_api_app LOGIN PASSWORD %L', :'app_db_password')
    WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'journal_api_app')
    \gexec
    SELECT format('ALTER ROLE journal_api_app LOGIN PASSWORD %L', :'app_db_password')
    \gexec
    CREATE TABLE IF NOT EXISTS public.entries (
        id VARCHAR PRIMARY KEY,
        data JSONB NOT NULL,
        created_at TIMESTAMPTZ NOT NULL,
        updated_at TIMESTAMPTZ NOT NULL
    );
    CREATE INDEX IF NOT EXISTS idx_entries_created_at ON public.entries(created_at);
    CREATE INDEX IF NOT EXISTS idx_entries_data_gin ON public.entries USING GIN (data);
    GRANT CONNECT ON DATABASE journal TO journal_api_app;
    GRANT USAGE ON SCHEMA public TO journal_api_app;
    GRANT SELECT, INSERT, UPDATE, DELETE ON public.entries TO journal_api_app;
---
apiVersion: batch/v1
kind: Job
metadata:
  name: journal-api-db-bootstrap-00000000
  namespace: journal-api
  labels:
    app.kubernetes.io/name: journal-api-db-bootstrap
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: journal-api-db-bootstrap
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: postgres:16-alpine
          command:
            - sh
            - -ec
            - psql -h "$PGHOST" -U "$PGUSER" -d "$PGDATABASE" -v ON_ERROR_STOP=1 -f /bootstrap/bootstrap.sql
          envFrom:
            - secretRef:
                name: journal-api-db-bootstrap
          env:
            - name: PGSSLMODE
              value: require
          volumeMounts:
            - name: bootstrap-sql
              mountPath: /bootstrap
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: bootstrap-sql
          configMap:
            name: journal-api-database-bootstrap
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
